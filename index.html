<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f6f7fb">
  <meta name="description" content="株価と前日比をすばやく計算。オフラインで使えるコンパクトな株価ツール。">
  <title>TickShift</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%23665be8'/%3E%3Ctext x='20' y='28' text-anchor='middle' font-family='sans-serif' font-size='26' fill='white'%3E%25%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script src="calculator.js" defer></script>
  <script src="app.js" defer></script>
  <script src="pwa.js" defer></script>
</head>
<body>
  <div class="page-shell">
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="TickShift ホーム">
        <span class="brand-mark" aria-hidden="true">%</span>
        <h1 class="brand-title">TickShift</h1>
      </a>
      <div class="header-actions">
        <button id="install-app" class="install-button" type="button" hidden>アプリとして追加</button>
      </div>
    </header>

    <aside id="app-update" class="update-notice" aria-live="polite" hidden>
      <p>新しい版があります</p>
      <button id="update-app" type="button">更新する</button>
    </aside>

    <main aria-label="株価と前日比の計算">
      <section class="baseline-card" aria-labelledby="baseline-heading">
        <div class="baseline-heading">
          <span id="baseline-icon" class="baseline-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v16h16M8 14l4-5 4 3 4-7"/></svg>
          </span>
          <h2 id="baseline-heading"><label for="baseline">前日終値</label></h2>
          <p id="baseline-help" class="sr-only">この金額を両方の計算に使います。</p>
        </div>
        <div class="baseline-field">
          <div class="input-wrap baseline-input-wrap">
            <input id="baseline" type="text" inputmode="decimal" enterkeyhint="done" value="" autocomplete="off" spellcheck="false" aria-describedby="baseline-help baseline-error" maxlength="24">
            <button class="input-clear" type="button" data-clear="baseline" aria-label="前日終値をクリア" title="クリア" disabled><span aria-hidden="true">×</span></button>
            <span class="input-unit" aria-hidden="true">円</span>
          </div>
          <p class="field-error" id="baseline-error" aria-live="polite"></p>
        </div>
      </section>

      <details id="baseline-helper" class="baseline-helper">
        <summary>前日終値がわからないとき</summary>
        <div class="helper-grid">
          <div>
            <label class="field-label" for="current-price">現在値<span class="sr-only">（円）</span></label>
            <div class="input-wrap">
              <input id="current-price" type="text" inputmode="decimal" enterkeyhint="done" value="" autocomplete="off" spellcheck="false" aria-describedby="baseline-helper-error" maxlength="24">
              <button class="input-clear" type="button" data-clear="current-price" aria-label="現在値をクリア" title="クリア" disabled><span aria-hidden="true">×</span></button>
              <span class="input-unit" aria-hidden="true">円</span>
            </div>
          </div>
          <div>
            <label class="field-label" for="price-change">前日比<span class="sr-only">（円）</span></label>
            <div class="input-wrap">
              <button id="change-sign" class="sign-toggle" type="button" aria-label="現在プラス。マイナスに切り替え">+</button>
              <input id="price-change" type="text" inputmode="decimal" enterkeyhint="done" value="" autocomplete="off" spellcheck="false" aria-describedby="baseline-helper-error" maxlength="24">
              <button class="input-clear" type="button" data-clear="price-change" aria-label="前日比の金額をクリア" title="クリア" disabled><span aria-hidden="true">×</span></button>
              <span class="input-unit" aria-hidden="true">円</span>
            </div>
          </div>
        </div>
        <p id="baseline-helper-error" class="field-error" aria-live="polite"></p>
        <div class="helper-result">
          <div>
            <span class="helper-result-label">計算した基準値</span>
            <output id="inferred-baseline" for="current-price price-change" aria-live="polite">—</output>
          </div>
          <button id="apply-baseline" type="button" disabled>使う</button>
        </div>
        <p class="helper-note">分割・権利落ち時は、表示元の比較基準値になります。</p>
      </details>

      <div class="calculator-grid">
        <section class="calculator-card" aria-labelledby="percent-heading">
          <div class="card-heading">
            <span class="step">01</span>
            <h2 id="percent-heading" class="direction-label">前日比(%) → 株価</h2>
          </div>
          <label class="sr-only" for="rate">前日比（％）</label>
          <div class="rate-entry">
            <button id="toggle-sign" class="sign-toggle" type="button" aria-label="現在プラス。マイナスに切り替え">+</button>
            <div class="input-wrap rate-input-wrap">
              <input id="rate" type="text" inputmode="decimal" enterkeyhint="done" value="" autocomplete="off" spellcheck="false" aria-describedby="rate-help rate-error" maxlength="24">
              <button class="input-clear" type="button" data-clear="rate" aria-label="前日比の率をクリア" title="クリア" disabled><span aria-hidden="true">×</span></button>
            </div>
            <span class="rate-unit" aria-hidden="true">%</span>
            <div class="rate-stepper" role="group" aria-label="前日比を0.1ずつ調整">
              <button id="rate-up" type="button" aria-label="0.1増やす"><span aria-hidden="true">▲</span></button>
              <button id="rate-down" type="button" aria-label="0.1減らす"><span aria-hidden="true">▼</span></button>
            </div>
            <div class="rate-stepper" role="group" aria-label="前日比を1ずつ調整">
              <button id="rate-whole-up" type="button" aria-label="1増やす"><svg class="double-triangle" viewBox="0 0 18 20" aria-hidden="true" focusable="false"><path d="M9 1 2 8h14Z"/><path d="M9 11 2 18h14Z"/></svg></button>
              <button id="rate-whole-down" type="button" aria-label="1減らす"><svg class="double-triangle is-down" viewBox="0 0 18 20" aria-hidden="true" focusable="false"><path d="M9 1 2 8h14Z"/><path d="M9 11 2 18h14Z"/></svg></button>
            </div>
          </div>
          <p id="rate-help" class="sr-only">左のボタンで符号を切り替えます。右の一重三角で0.1ずつ、二重三角で1ずつ数字を増減できます。</p>
          <div class="presets" role="group" aria-label="よく使う騰落率">
            <button type="button" data-rate="1" aria-pressed="false">1%</button>
            <button type="button" data-rate="2" aria-pressed="false">2%</button>
            <button type="button" data-rate="3" aria-pressed="false">3%</button>
            <button type="button" data-rate="4" aria-pressed="false">4%</button>
            <button type="button" data-rate="5" aria-pressed="false">5%</button>
            <button type="button" data-rate="7" aria-pressed="false">7%</button>
            <button type="button" data-rate="10" aria-pressed="false">10%</button>
          </div>
          <p class="field-error" id="rate-error" aria-live="polite"></p>

          <div id="percent-panel" class="result-panel is-flat" aria-live="polite" aria-atomic="true">
            <div class="result-topline sr-only"><span>株価</span><span id="rate-badge" class="result-badge">入力待ち</span></div>
            <output id="percent-result" class="main-result" for="baseline rate"><span id="percent-result-value">—</span><span class="result-unit">円</span></output>
            <p id="rounded-price" class="rounded-price"></p>
            <div class="delta-row"><span>値幅</span><strong id="percent-delta">—</strong></div>
          </div>
          <p id="percent-formula" hidden></p>
        </section>

        <section class="calculator-card" aria-labelledby="price-heading">
          <div class="card-heading">
            <span class="step">02</span>
            <h2 id="price-heading" class="direction-label">株価 → 前日比(%)</h2>
          </div>
          <label class="sr-only" for="price">株価（円）</label>
          <div class="input-wrap price-input-wrap">
            <input id="price" type="text" inputmode="decimal" enterkeyhint="done" value="" autocomplete="off" spellcheck="false" aria-describedby="price-help price-error" maxlength="24">
            <button class="input-clear" type="button" data-clear="price" aria-label="株価をクリア" title="クリア" disabled><span aria-hidden="true">×</span></button>
            <span class="input-unit" aria-hidden="true">円</span>
          </div>
          <p id="price-help" class="sr-only">現在値や目標の株価を入力してください。</p>
          <p class="field-error" id="price-error" aria-live="polite"></p>

          <div id="price-panel" class="result-panel is-flat" aria-live="polite" aria-atomic="true">
            <div class="result-topline sr-only"><span>前日比</span><span id="price-badge" class="result-badge">入力待ち</span></div>
            <output id="price-result" class="main-result" for="baseline price"><span id="price-result-value">—</span><span class="result-unit">%</span></output>
            <p id="rate-description" class="sr-only"></p>
            <div class="delta-row"><span>値幅</span><strong id="price-delta">—</strong></div>
          </div>
          <p id="price-formula" hidden></p>
        </section>
      </div>

      <div class="usage-note">
        <svg aria-hidden="true" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="10" cy="10" r="7.2"/><path d="M10 9v5M10 6v1"/></svg>
        <p>注文時の呼値単位は未調整です。</p>
      </div>
      <noscript><p class="noscript-message">計算するには、ブラウザのJavaScriptを有効にしてください。</p></noscript>
    </main>

    <footer class="site-footer">
      <p id="storage-status">入力はこのブラウザに保存されます</p>
      <button id="reset" type="button">すべてクリア</button>
    </footer>
  </div>
</body>
</html>
